<div class="dashboard-container">
    <!-- TÍTULO DINÁMICO: Cambia según la opción del sidebar -->
    <h2 class="panel-title" style="margin-bottom: 20px; color: #2d3436; font-weight: 600;">
        {{ isConfigRoute ? 'Configuración de Cuenta' : 'Panel del Moderador 🛡️' }}
    </h2>

    <!-- VISTA A: TUS TARJETAS (Se mantienen exactamente igual) -->
    <div class="cards-grid" *ngIf="!isConfigRoute" style="display: flex; gap: 20px;">
        <div class="card shadow">
            <div class="card-icon blue">👥</div>
            <div class="card-info">
                <h3>USUARIOS</h3>
                <p class="number">{{ totalUsuarios }}</p>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-icon green">📝</div>
            <div class="card-info">
                <h3>PUBLICACIONES</h3>
                <p class="number">{{ publicaciones }}</p>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-icon red">🚫</div>
            <div class="card-info">
                <h3>REPORTES</h3>
                <p class="number">{{ reportes }}</p>
            </div>
        </div>

        <div class="card shadow">
            <div class="card-icon orange">💬</div>
            <div class="card-info">
                <h3>COMENTARIOS</h3>
                <p class="number">{{ comentariosReportados }}</p>
            </div>
        </div>
    </div>

    <!-- VISTA B: FORMULARIO DE CONFIGURACIÓN -->
    <div class="config-card shadow animate-fade-in" *ngIf="isConfigRoute" style="background: white; padding: 30px; border-radius: 15px; max-width: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
        <section class="form-section">
            <h3 style="margin-bottom: 15px; color: #636e72;">Datos del Perfil</h3>
            
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight: 500;">Nombre</label>
                <input type="text" [(ngModel)]="nombre" style="width:100%; padding:12px; border-radius:8px; border:1px solid #dfe6e9; outline: none;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight: 500;">Apellido</label>
                <input type="text" [(ngModel)]="apellido" style="width:100%; padding:12px; border-radius:8px; border:1px solid #dfe6e9; outline: none;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom:5px; font-weight: 500;">Correo</label>
                <input type="text" [value]="correo" disabled style="width:100%; padding:12px; border-radius:8px; background:#f1f2f6; border:1px solid #dfe6e9; color:#b2bec3; cursor: not-allowed;">
            </div>

            <button (click)="guardarCambiosPerfil()" style="background:#6c5ce7; color:white; border:none; padding:14px; border-radius:8px; cursor:pointer; font-weight:bold; width:100%; transition: 0.3s;">
                Guardar Cambios
            </button>
        </section>

        <hr style="margin: 30px 0; border:0; border-top: 1px solid #f1f2f6;">

        <section class="form-section">
            <h3 style="margin-bottom: 15px; color: #636e72;">Seguridad</h3>
            <div style="margin-bottom: 15px;">
                <label style="display:block; margin-bottom:5px; font-weight: 500;">Nueva Contraseña</label>
                <input type="password" [(ngModel)]="nuevaClave" placeholder="Mínimo 6 caracteres" style="width:100%; padding:12px; border-radius:8px; border:1px solid #dfe6e9; outline: none;">
            </div>
            <button (click)="actualizarPassword()" style="background:none; border:1px solid #6c5ce7; color:#6c5ce7; padding:12px; border-radius:8px; cursor:pointer; width:100%; font-weight: 500;">
                Actualizar Contraseña
            </button>
        </section>

        <!-- Mensajes -->
        <div style="margin-top: 20px;">
            <p *ngIf="mensaje" style="color:#00b894; font-weight: 500;">{{ mensaje }}</p>
            <p *ngIf="errorMessage" style="color:#d63031; font-weight: 500;">{{ errorMessage }}</p>
        </div>
    </div>
</div>
