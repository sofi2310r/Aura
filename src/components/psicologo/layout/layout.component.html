<div class="page">
    <app-navbar-psicologo [titulo]="'Panel de Psicólogo'"></app-navbar-psicologo>

    <div class="layout">
        <aside class="sidebar">
            <h2 class="logo">
                <span class="logo-icon">🧠</span>
                <span class="logo-text">AURA</span>
            </h2>

            <nav class="menu">
                <a class="menu-item" routerLink="/psicologo" routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: true }">
                    <span class="menu-icon">🏡</span>
                    <span class="menu-text">Panel</span>
                </a>

                <a class="menu-item" routerLink="/psicologo/citas" routerLinkActive="active">
                    <span class="menu-icon">📅</span>
                    <span class="menu-text">Citas</span>
                </a>

                <a class="menu-item" routerLink="/psicologo/pacientes" routerLinkActive="active">
                    <span class="menu-icon">👥</span>
                    <span class="menu-text">Pacientes</span>
                </a>

                <a class="menu-item" routerLink="/psicologo/chat" routerLinkActive="active">
                    <span class="menu-icon">💬</span>
                    <span class="menu-text">Chat</span>
                </a>

                <a class="menu-item" routerLink="/psicologo/notas-clinicas" routerLinkActive="active">
                    <span class="menu-icon">📋</span>
                    <span class="menu-text">Notas clínicas</span>
                </a>

                <a class="menu-item" routerLink="/psicologo/foro" routerLinkActive="active">
                    <span class="menu-icon">🗨</span>
                    <span class="menu-text">Foro</span>
                </a>

                <a class="menu-item" routerLink="/psicologo/configuracion" routerLinkActive="active">
                    <span class="menu-icon">⚙️</span>
                    <span class="menu-text">Configuración</span>
                </a>
            </nav>
        </aside>

        <div class="main">

            <router-outlet *ngIf="!router.url.includes('configuracion')"></router-outlet>

            <div *ngIf="router.url.includes('configuracion')" class="config-container">

                <div class="header-section">
                    <h1 class="titulo-principal">Configuración de Perfil</h1>
                    <p class="subtitle">Actualiza tu información de psicólogo</p>
                </div>

                <div class="edit-header">
                    <h3>Datos Personales</h3>
                    
                    <button type="button" 
                            class="btn-edit-toggle" 
                            *ngIf="!editando"
                            (click)="habilitarEdicion()"
                            title="Editar perfil">
                        <span class="pencil-icon">✏️</span>
                        <span class="toggle-text">Editar Perfil</span>
                    </button>
                </div>

                <form #perfilForm="ngForm" 
                      (submit)="perfilForm.valid && nombre.trim() && apellido.trim() && guardarCambiosPerfil(); $event.preventDefault()" 
                      class="card-edit">

                    <div class="form-grid">

                        <div class="form-group">
                            <label>Nombre <span class="required-asterisk" *ngIf="editando">*</span></label>
                            <input type="text" 
                                   name="nombre" 
                                   [(ngModel)]="nombre" 
                                   #nombreForm="ngModel"
                                   class="form-control"
                                   [disabled]="!editando"
                                   [class.editable-input]="editando"
                                   [class.input-error]="editando && nombreForm.invalid && (nombreForm.dirty || nombreForm.touched)"
                                   required>
                            
                            <span class="error-message" *ngIf="editando && nombreForm.invalid && (nombreForm.dirty || nombreForm.touched)">
                                El nombre es un campo obligatorio.
                            </span>
                        </div>

                        <div class="form-group">
                            <label>Apellido <span class="required-asterisk" *ngIf="editando">*</span></label>
                            <input type="text" 
                                   name="apellido" 
                                   [(ngModel)]="apellido" 
                                   #apellidoForm="ngModel"
                                   class="form-control"
                                   [disabled]="!editando"
                                   [class.editable-input]="editando"
                                   [class.input-error]="editando && apellidoForm.invalid && (apellidoForm.dirty || apellidoForm.touched)"
                                   required>
                            
                            <span class="error-message" *ngIf="editando && apellidoForm.invalid && (apellidoForm.dirty || apellidoForm.touched)">
                                 El apellido es un campo obligatorio.
                            </span>
                        </div>

                        <div class="form-group">
                            <label>Correo Electrónico</label>
                            <input type="email" 
                                   [value]="psicologoUser?.correo" 
                                   disabled 
                                   class="form-control disabled">
                        </div>

                    </div>

                    <div class="form-actions" *ngIf="editando" style="display: flex; gap: 10px; margin-top: 20px;">
                        
                        <button type="submit" 
                                class="btn-primary" 
                                [disabled]="!perfilForm.valid || !nombre.trim() || !apellido.trim()">
                            Guardar Cambios
                        </button>

                        <button type="button" 
                                class="btn-cancelar"
                                (click)="cancelarEdicion(perfilForm, $event)"
                                style="background-color: #d33; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 500;">
                            Cancelar
                        </button>
                        
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
